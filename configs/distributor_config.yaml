server:
  listen_port: 9100

queue:
  max_queue_samples: 262144
  max_queue_fragments: 4096
  max_fragment_samples: 128  # whole-fragment assembly overshoot bound
  max_queue_estimated_bytes: 536870912
  max_dedup_entries: 1000000  # 已完成 batch_id 的有界重试历史；活跃队列不受此值截断
  high_watermark_ratio: 0.8
  default_get_timeout_ms: 1000
  default_lease_timeout_ms: 10000
  delivery_history_size: 4096
  credit_ttl_ms: 10000
  credit_wait_retry_after_ms: 100
  max_demand_ttl_ms: 60000

# Exact rl-contracts artifact identity. A process must fail closed when this
# identity is missing or differs from the mounted generated bindings.
contract:
  package_name: rl-contracts
  package_version: 0.10.0
