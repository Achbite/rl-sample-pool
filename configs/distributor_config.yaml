server:
  listen_port: 9100

queue:
  max_queue_samples: 262144
  max_queue_fragments: 4096
  max_queue_estimated_bytes: 536870912
  max_dedup_entries: 1000000  # 已完成 batch_id 的有界重试历史；活跃队列不受此值截断
  high_watermark_ratio: 0.8
  default_get_timeout_ms: 1000
  default_lease_timeout_ms: 10000
  delivery_history_size: 4096

