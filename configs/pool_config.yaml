server:
  listen_port: 9100

backend:
  type: local_memory

storage:
  capacity_transitions: 10240
  capacity_bytes: 536870912

# Both modes read snapshots without consuming resident samples. This choice
# only controls duplicate item IDs within one batch; cross-batch reuse is allowed.
sampling:
  strategy: uniform_without_replacement  # or uniform_with_replacement
  seed: 0

eviction:
  strategy: fifo_ready

queue:
  max_dedup_entries: 1000000  # bounded accepted object-ID retry history
  high_watermark_ratio: 0.8
  default_get_timeout_ms: 1000
  default_lease_timeout_ms: 10000
  delivery_history_size: 4096
