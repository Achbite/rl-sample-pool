server:
  listen_port: 9100

backend:
  type: local_memory

storage:
  capacity_transitions: 10240
  capacity_bytes: 536870912

sampling:
  strategy: uniform_without_replacement
  seed: 0

eviction:
  strategy: fifo_ready

queue:
  max_dedup_entries: 1000000  # bounded terminal UID/digest retry history
  high_watermark_ratio: 0.8
  default_get_timeout_ms: 1000
  default_lease_timeout_ms: 10000
  delivery_history_size: 4096

# Exact rl-contracts artifact identity. A process must fail closed when this
# identity is missing or differs from the mounted generated bindings.
contract:
  package_name: rl-contracts
  package_version: 0.15.0
  source_digest: ebcad0a4c652243ca16fc2c8c14d3f7b4b3b95f1bbd925c7063d22907374c026
  artifact_digest: 0c278cfcf85ab4dbff72177eeeea165ebb113bb36867ae71975bf8c14da2be33
  platform: linux/arm64
  generator_identity: 0eb73fc2cb675bdb34bf3db9c99dae62a82f93a5e3a72db84dcf3936464729c8
